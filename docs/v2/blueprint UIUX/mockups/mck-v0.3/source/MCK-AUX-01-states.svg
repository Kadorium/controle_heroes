.btn-ghost{fill:#FFFFFF;stroke:#D5DCE5;stroke-width:1}.input{fill:#FFFFFF;stroke:#D5DCE5;stroke-width:1}
.filter-chip{fill:#FFFFFF;stroke:#D5DCE5;stroke-width:1}.filter-chip-on{fill:#E8F1F8;stroke:#1F4E79;stroke-width:1}
.close-hit{fill:#FFFFFF;stroke:#D5DCE5;stroke-width:1}.panel{fill:#FFFFFF;stroke:#D5DCE5;stroke-width:1}
.banner{fill:#E8F1F8;stroke:#1F4E79;stroke-width:1}.okbox{fill:#E8F5EE;stroke:#067647;stroke-width:1}
