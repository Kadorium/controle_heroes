]]></style></defs>
  <rect class="bg" width="1440" height="900"/>
  
  <rect class="sidebar" x="0" y="0" width="220" height="900"/>
  <text class="side-text" x="24" y="36" font-size="15" font-weight="700">Epic Controle</text>
  <text class="side-muted" x="24" y="54" font-size="11">V2 · Order-to-Pay</text>
  <line x1="24" y1="68" x2="196" y2="68" stroke="#2F4158" stroke-width="1"/>
  <text class="side-muted" x="24" y="96" font-size="11" font-weight="600" letter-spacing=".06em">COMPRAS</text>
  <rect x="12" y="110" width="196" height="28" rx="4" fill="#243447"/><text class="side-text" x="36" y="124" font-size="12.5">Pedidos</text>
  <text class="side-muted" x="36" y="152" font-size="12.5">Faturas</text>
  <text class="side-muted" x="24" y="192" font-size="11" font-weight="600" letter-spacing=".06em">FINANCEIRO</text>
  <text class="side-muted" x="36" y="220" font-size="12.5">Contas a pagar</text>
  <text class="side-muted" x="36" y="248" font-size="12.5">Pagamentos</text>
  <rect x="16" y="768" width="188" height="52" rx="6" fill="#243447"/>
  <text class="side-muted" x="28" y="788" font-size="10">EUR / BRL</text>
  <text class="side-text mono" x="28" y="808" font-size="13" font-weight="600">6,2180</text>
  <text class="side-muted" x="118" y="808" font-size="10">desatualizado</text>
  <text class="side-text" x="28" y="848" font-size="12.5" font-weight="600">Admin</text>
  <text class="side-muted" x="28" y="870" font-size="12">Sair</text>

  <text class="muted" x="244" y="28" font-size="12">Referência  /  Estados auxiliares</text>
  <text class="text" x="244" y="56" font-size="22" font-weight="700">Estados essenciais</text>
  <text class="muted" x="244" y="76" font-size="12">Família visual · recuperação · sem fluxos novos</text><rect class="okbox" x="244" y="100" width="460" height="180" rx="8"/><text class="text" x="264" y="136" font-size="14" font-weight="700">Confirmar emissão</text><text class="muted" x="264" y="170" font-size="12">Emitir INV-H-8910 cria 2 obrigações de EUR 280,00. Confirmar?</text><text class="text" x="264" y="210" font-size="12" font-weight="600">Emitir · Cancelar</text><text class="muted" x="264" y="250" font-size="11">SCR-007 · FLW-002</text><rect class="okbox" x="740" y="100" width="460" height="180" rx="8"/><text class="text" x="760" y="136" font-size="14" font-weight="700">Confirmar alocação</text><text class="muted" x="760" y="170" font-size="12">Alocar EUR 700,00 → PY-8841-2. Saldo → 520,00. Residual → 0.</text><text class="text" x="760" y="210" font-size="12" font-weight="600">Confirmar · Voltar</text><text class="muted" x="760" y="250" font-size="11">SCR-012 · FLW-004</text><rect class="errbox" x="244" y="320" width="460" height="180" rx="8"/><text class="text" x="264" y="356" font-size="14" font-weight="700">Conflito 409</text><text class="muted" x="264" y="390" font-size="12">Versão desatualizada. Recarregue e tente novamente.</text><text class="text" x="264" y="430" font-size="12" font-weight="600">Recarregar</text><text class="muted" x="264" y="470" font-size="11">expected_version</text><rect class="errbox" x="740" y="320" width="460" height="180" rx="8"/><text class="text" x="760" y="356" font-size="14" font-weight="700">Sem permissão 403</text><text class="muted" x="760" y="390" font-size="12">Ação ocultada ou bloqueada. Contate Admin.</text><text class="text" x="760" y="430" font-size="12" font-weight="600">Voltar</text><text class="muted" x="760" y="470" font-size="11">RBAC</text><rect class="warnbox" x="244" y="540" width="460" height="180" rx="8"/><text class="text" x="264" y="576" font-size="14" font-weight="700">Sem resultados</text><text class="muted" x="264" y="610" font-size="12">Nenhuma obrigação com os filtros atuais.</text><text class="text" x="264" y="650" font-size="12" font-weight="600">Limpar filtros</text><text class="muted" x="264" y="690" font-size="11">SCR-008</text><rect class="warnbox" x="740" y="540" width="460" height="180" rx="8"/><text class="text" x="760" y="576" font-size="14" font-weight="700">Cotação FX falhou</text><text class="muted" x="760" y="610" font-size="12">Atualização indisponível. Mantém cotação anterior se existir.</text><text class="text" x="760" y="650" font-size="12" font-weight="600">Tentar de novo</text><text class="muted" x="760" y="690" font-size="11">SCR-009</text>
</svg>
