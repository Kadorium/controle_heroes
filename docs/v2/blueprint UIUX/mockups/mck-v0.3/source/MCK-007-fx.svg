700">B · Mercado</text><text class="muted" x="656" y="160" font-size="11">Cotação EUR/BRL</text><text class="text mono" x="656" y="186" font-size="22" font-weight="700">6,2180</text><rect class="badge-att" x="656" y="200" width="100" height="20" rx="4"/><text class="badge-att-t" x="706.0" y="214" font-size="10.5" font-weight="600" text-anchor="middle">Desatualizado</text><text class="muted" x="656" y="250" font-size="12">Fonte: Frankfurter</text><text class="muted" x="656" y="276" font-size="12">Timestamp: 27/07/2026 18:00Z</text><rect class="accent" x="656" y="310" width="180" height="32" rx="5"/><text class="white" x="746" y="331" font-size="12" font-weight="600" text-anchor="middle">Atualizar cotação</text><text class="muted" x="656" y="380" font-size="11">Se a atualização falhar, a cotação anterior permanece visível.</text><rect class="panel" x="1036" y="120" width="364" height="520" rx="6"/><text class="text" x="1052" y="144" font-size="13" font-weight="700">C · Executado / valuation</text><rect class="warnbox" x="1052" y="156" width="332" height="80" rx="6"/><text class="text" x="1068" y="190" font-size="13" font-weight="700">Nenhuma execução cambial vinculada.</text><text class="muted" x="1068" y="214" font-size="12">Ausência ≠ zero.</text><text class="muted" x="1052" y="270" font-size="12">Taxa executada</text><text class="text mono" x="1052" y="294" font-size="16">—</text><text class="muted" x="1052" y="330" font-size="12">Valor realizado</text><text class="text mono" x="1052" y="354" font-size="16">—</text><text class="muted" x="1052" y="390" font-size="12">PnL realizado</text><text class="text mono" x="1052" y="414" font-size="16">—</text><text class="muted" x="1052" y="460" font-size="11">A execução aparece quando houver pagamento/alocação cambial vinculada.</text><rect class="panel" x="244" y="660" width="1156" height="100" rx="6"/><text class="text" x="260" y="684" font-size="13" font-weight="700">Documento e auditoria</text><text class="muted" x="260"