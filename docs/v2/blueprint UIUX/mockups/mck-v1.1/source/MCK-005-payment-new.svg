  <text class="muted" x="260" y="520" font-size="11">O identificador do pagamento só aparece depois do registro.</text>
  <text class="muted" x="260" y="544" font-size="11">Informe fornecedor, data, valor, moeda, referência e comprovante.</text>
  <rect class="panel" x="884" y="212" width="516" height="300" rx="6"/>
  <text class="text" x="900" y="236" font-size="13" font-weight="700">Importante</text>
  <rect class="warnbox" x="900" y="252" width="484" height="88" rx="6"/>
  <text class="text" x="916" y="280" font-size="13" font-weight="600">Registrar o pagamento não reduz o saldo da obrigação.</text>
  <text class="text" x="916" y="308" font-size="13">A liquidação ocorre na etapa de alocação.</text>
  <text class="muted" x="900" y="370" font-size="12">Depois de registrar, você poderá alocar o valor às obrigações elegíveis.</text>
  <text class="muted" x="900" y="400" font-size="12">O saldo de PY-8841-2 permanece EUR 1.220,00 até a alocação.</text>
