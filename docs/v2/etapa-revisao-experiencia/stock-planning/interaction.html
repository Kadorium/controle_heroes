-columns:100px 1fr 100px;gap:13px;align-items:center;font-size:14px;margin-top:13px}.bar{height:6px;background:#eff2f1;border-radius:5px}.bar i{display:block;height:100%;background:#91b5a6;border-radius:5px}.priority{padding-left:25px;border-left:1px solid var(--line)}.priority h3{font-size:20px;margin:15px 0 7px}.priority p{color:var(--muted);margin:8px 0}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#205849}.priority .primary{margin-top:9px}.meta{margin-top:16px;font-size:12px;color:var(--muted)}dialog{border:1px solid #dce1e3;border-radius:12px;padding:22px;min-width:330px;max-width:470px;box-shadow:0 14px 50px #0002}dialog::backdrop{background:#0002}dialog h2{margin-bottom:17px}dialog label{display:flex;align-items:center;gap:10px;margin:14px 0}dialog label input[type=checkbox]{accent-color:var(--green);width:17px;height:17px}dialog footer{display:flex;justify-content:flex-end;gap:15px;margin-top:20px}.save-label{display:block!important}.save-label input{margin-top:7px;width:100%}.toast{margin:8px 0;color:var(--green);font-size:13px}.empty{padding:32px 0;color:var(--muted)}.back{margin-bottom:20px}.selected-data{max-width:850px;margin-top:24px}.collapsed aside{width:68px}.collapsed main{margin-left:68px}.collapsed aside nav span,.collapsed aside nav small,.collapsed aside footer,.collapsed .brand span{display:none}.collapsed aside nav button{padding:12px 10px}.collapsed .brand{font-size:0}.collapsed .brand:before{content:'E';font-size:22px}

<aside><div class="brand">EPIC<span> /</span></div><nav id="nav"></nav><footer>Demonstração<br><small>Consulta pessoal proposta</small></footer><button id="collapse" aria-label="Recolher navegação">⇤</button></aside><main id="main"></main><dialog id="picker"></dialog>
<script type="module">
const revision='stock-executive-planning-20261023.2';
// IDs, prices and quantities below are illustrative only. No request to EPIC.
const types={clothes:'Roupas',rackets:'Raquetes',balls:'Bolas',overgrips:'Overgrips'};
const modalities={bt:'Beach Tennis',padel:'Padel',pickleball:'Pickleball'};
const groupLabels={item_kind:'Tipo de item',model:'Modelo',modality_set:'Modalidade',none:'Sem agrupamento'};
const measures={quantity:'Quantidade',cost:'Custo',sale:'Venda'};
const data=[
 ['Atlas Pro','G2','rackets',['bt'],20,'UN',590,900],['Atlas Pro','G3','rackets',['bt'],10,'UN',620,950],['Atlas Team','G2','rackets',['bt'],16,'UN',500,800],
 ['Regata Arena','P','clothes',['bt','padel'],24,'UN',70,160],['Regata Arena','M','clothes',['bt','padel'],18,'UN',70,160],['Short Match','M','clothes',['bt','padel'],12,'UN',90,190],
 ['Bola Stage 2','Caixa 50','balls',['bt'],6,'CX',180,300],['Bola Pro','Caixa 50','balls',['bt'],4,'CX',200,340],
 ['Overgrip H','Branco · pacote 60','overgrips',['bt','padel'],12,'PCT',90,150],['Overgrip H','Cores · pacote 60','overgrips',['bt','padel'],10,'PCT',95,160],
 ['Aurora Carbon','Padrão','rackets',['padel'],24,'UN',600,1000],['Vega Control','G2','rackets',['pickleball'],12,'UN',400,700]
].map((d,i)=>({id:i+1,name:d[0],model:d[0],variant:d[1],type:d[2],sports:d[3],qty:d[4],unit:d[5],cost:d[6],price:d[7],sku:'PROP-'+String(i+1).padStart(3,'0')}));
const money=n=>n==null?'—':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:Number.isInteger(n)?0:2}).format(n);
const defaults={filters:{modalities:['bt'],types:[],models:[],q:'',position:'domestic'},group:'item_kind',measureKeys:['quantity','cost','sale'],chartMeasure:'cost',visibleFilters:['modalities','types'],columns:['identity','quantity','unit_cost','cost','unit_price','sale'],sort:'cost_desc',page:0,pageSize:25};
const clone=o=>JSON.parse(JSON.stringify(o)),storageKey='epic-planning2-default';let state=clone(defaults),mode='dashboard',notice='',expanded=new Set(),backFocus='',backY=0;
const icon='<svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="3"/><path d="M3 9h14M9 9v8"/></svg>';
function restore(){const u=new URL(location);mode=u.searchParams.get('screen')||'dashboard';const stored=localStorage.getItem(storageKey);state=u.searchParams.has('state')?JSON.parse(u.searchParams.get('state')):stored?JSON.parse(stored):clone(defaults);if(u.searchParams.has('required')&&!u.searchParams.has('state'))state.filters.types=['clothes','rackets','balls'];}
function route(screen=mode,push=false,extra={}){const u=new URL(location);u.search='';u.searchParams.set('screen',screen);u.searchParams.set('state',JSON.stringify(state));for(const[k,v]of Object.entries(extra))u.searchParams.set(k,v);history[push?'pushState':'replaceState']({},'',u);mode=screen;render();}
function population(){return data.filter(r=>(!state.filters.modalities.length||r.sports.some(s=>state.filters.modalities.includes(s)))&&(!state.filters.types.length||state.filters.types.includes(r.type))&&(!state.filters.models.length||state.filters.models.includes(r.model))&&(!state.filters.q||(r.name+' '+r.sku).toLowerCase().includes(state.filters.q.toLowerCase())));}
function totals(rows){const units={};let cost=0,sale=0;for(const r of rows){units[r.unit]=(units[r.unit]||0)+r.qty;cost+=r.qty*r.cost;sale+=r.qty*r.price;}return{units,cost,sale,count:rows.length};}
function quantities(rows){return Object.entries(totals(rows).units).map(([u,q])=>`${q}\u00a0${u}`).join(' · ')||'0 produtos';}
function groups(rows){if(state.group==='none')return[];const map=new Map();for(const r of rows){const key=state.group==='item_kind'?types[r.type]:state.group==='model'?r.model:r.sports.map(s=>modalities[s]).join(' + ');if(!map.has(key))map.set(key,[]);map.get(key).push(r)}return[...map].sort((a,b)=>totals(b[1]).cost-totals(a[1]).cost);}
function metrics(rows){const t=totals(rows);const blocks={quantity:`<label>Disponível físico</label><strong>${quantities(rows)}</strong><small>${t.count} SKUs · doméstico</small>`,cost:`<label>Custo do saldo</label><strong>${money(t.cost)}</strong><small>Custo gerencial · tributos brutos</small>`,sale:`<label>Venda potencial</label><strong>${money(t.sale)}</strong><small>Varejo · BRL · preço de tabela</small>`};return'<div class="metrics" id="metrics">'+state.measureKeys.map(k=>'<div>'+blocks[k]+'</div>').join('')+'</div>';}
function filterText(key){const values=state.filters[key],labels=key==='modalities'?modalities:types;return values.length?values.length===1?labels[values[0]]:`${values.length} ${key==='types'?'tipos':'modalidades'}`:key==='types'?'Todos os tipos':'Todas as modalidades';}
function filterButtons(){return `${state.visibleFilters.includes('modalities')?`<button id="modalities" data-pick="modalities" aria-label="Modalidades">${filterText('modalities')} ▾</button>`:''}${state.visibleFilters.includes('types')?`<button id="types" data-pick="types" aria-label="Tipos de item">${filterText('types')} ▾</button>`:''}${state.visibleFilters.includes('models')?'<button id="models" data-pick="models" aria-label="Modelos">Modelo ▾</button>':''}`;}
function choices(){return `<button id="measure" data-pick="measures" aria-label="Exibir medidas">Exibir: ${state.measureKeys.map(k=>({quantity:'Qtd',cost:'Custo',sale:'Venda'}[k])).join(' · ')} ▾</button>`;}
function grouping(){return`<label>Agrupar por <select id="group" aria-label="Agrupar por">${Object.entries(groupLabels).map(([id,label])=>`<option value="${id}" ${state.group===id?'selected':''}>${label}</option>`).join('')}</select></label>`;}
function chips(){return `<div class="refinements">${state.filters.modalities.map(id=>`<span class="pill">${modalities[id]}<button data-remove="modalities:${id}" aria-label="Remover ${modalities[id]}">×</button></span>`).join('')}${state.filters.types.map(id=>`<span class="pill">${types[id]}<button data-remove="types:${id}" aria-label="Remover ${types[id]}">×</button></span>`).join('')}${state.filters.models.map(id=>`<span class="pill">${id}<button data-remove="models:${id}" aria-label="Remover modelo ${id}">×</button></span>`).join('')}<span class="pill">Disponível físico</span><span class="pill">Varejo · BRL/unidade de venda</span><span class="push"></span>${mode==='stock'?grouping():''}</div>`;}
function header(title){return `<div class="top"><span>EPIC Controle</span><span class="pill">PROPOSTA · dados ilustrativos</span></div><div class="heading"><h1>${title}</h1><div class="row"><button id="reopen">Minha visão ▾</button><button id="save">Salvar visão</button></div></div>${notice?`<div class="toast" role="status">${notice}</div>`:''}`;}
function render(){document.querySelector('#nav').innerHTML=[['Visão geral','dashboard'],['Estoque','stock'],['Produtos','outside'],['Financeiro','outside'],['Operações','outside'],['Compras','outside'],['Documentos','outside'],['Custos','outside']].map(([label,s],i)=>(i===3?'<small>CONSULTAR E OPERAR</small>':'')+`<button data-route="${s}" class="${s===mode?'active':''}">${icon}<span>${label}</span></button>`).join('');const rows=population();if(mode==='product'){renderProduct();return;}if(mode==='dashboard')renderDashboard(rows);else renderStock(rows);bind();}
function renderDashboard(rows){const chart=state.chartMeasure;document.querySelector('#main').innerHTML=header('Visão geral')+`<section class="finance"><div class="section-head"><h2>Financeiro</h2><div class="row"><small>Vencimentos</small><button data-outside>Até 21 jan 2027 ▾</button></div></div><div class="numbers"><div><label>Saldo em euro · referência em reais</label><strong>R$ 6.788,88</strong><small>€ 1.200,00 · Cotação de referência ⓘ · 22 out <span class="pill warning">Desatualizada</span></small></div><div><label>Obrigações vencidas</label><strong>0</strong><small>No recorte · Abrir fila completa →</small></div></div></section><section class="dash-stock"><div class="section-head"><div class="row"><h2>Estoque</h2><small>Agora</small></div><div class="row">${filterButtons()}${choices()}<button class="quiet" id="explore">Explorar estoque →</button></div></div>${chips()}${metrics(rows)}<div class="split"><section><div class="section-head">${grouping()}<select id="chartMeasure" aria-label="Medida da composição">${Object.entries({quantity:'Quantidade',cost:'Custo do saldo',sale:'Venda potencial'}).filter(([id])=>state.measureKeys.includes(id)).map(([id,label])=>`<option value="${id}" ${id===chart?'selected':''}>${label}</option>`).join('')}</select></div><div id="composition">${state.group==='none'?'<p>Lista de produtos · <button class="quiet" id="view-list">Ver lista →</button></p>':groups(rows).map(([label,items])=>{const t=totals(items),value=chart==='cost'?t.cost:chart==='sale'?t.sale:null,total=chart==='cost'?totals(rows).cost:totals(rows).sale;return `<div class="barrow"><span>${label}</span>${value==null?'<span></span>':`<span class="bar"><i style="width:${total?value/total*100:0}%"></i></span>`}<span class="num">${value==null?quantities(items):money(value)}</span></div>`}).join('')}</div></section><section class="priority"><span class="pill warning">1 prioridade operacional</span><h3>Conferir declaração</h3><p>Compra Atlas · 10 unidades a liberar</p><button class="primary" data-outside>Abrir processo →</button></section></div></section><div class="meta">Agenda de caixa: out–dez 2026 · meses civis <button class="quiet" data-outside>Ver agenda →</button></div>`;}
function cells(items,isGroup=false){const t=totals(items),units=Object.keys(t.units),costUnit=units.length===1?t.cost/t.units[units[0]]:null;const prices=[...new Set(items.map(r=>r.price))];return `${state.measureKeys.includes('quantity')?`<td class="num">${quantities(items)}</td>`:''}${state.measureKeys.includes('cost')?`<td class="num">${costUnit==null?'Várias unidades':money(costUnit)}${isGroup&&units.length===1?'<small>Média ponderada</small>':''}</td><td class="num">${money(t.cost)}</td>`:''}${state.measureKeys.includes('sale')?`<td class="num">${prices.length===1?money(prices[0]):'Vários preços'}</td><td class="num">${money(t.sale)}</td>`:''}`;}
function productRow(r,child=false){return `<tr class="${child?'child':''}" data-product="${r.id}"><td><button class="product" id="open-${r.id}" data-open="${r.id}">${r.name} · ${r.variant}</button><small>${r.sku} · ${types[r.type]}${r.sports.length>1?' · BT + Padel':''}</small></td>${cells([r])}</tr>`;}
function renderStock(rows){const sorted=[...rows].sort((a,b)=>state.sort==='name'?a.name.localeCompare(b.name):b.cost*b.qty-a.cost*a.qty);const all=state.group==='none'?sorted:groups(sorted),page=all.slice(state.page*state.pageSize,(state.page+1)*state.pageSize);const body=state.group==='none'?page.map(r=>productRow(r)).join(''):page.map(([label,items])=>`<tr class="group"><td><button class="product" data-expand="${label}">${expanded.has(label)?'⌄':'›'} ${label}</button><small>${items.length} ${items.length===1?'SKU':'SKUs'} · Ver produtos</small></td>${cells(items,true)}</tr>${expanded.has(label)?items.map(r=>productRow(r,true)).join(''):''}`).join('');document.querySelector('#main').innerHTML=header('Estoque')+`<div class="toolbar"><input id="search" aria-label="Buscar produto" value="${state.filters.q}" placeholder="Buscar produto ou SKU">${filterButtons()}<button class="quiet" id="more">Mais filtros</button><span class="grow"></span>${choices()}</div>${chips()}${metrics(rows)}<div class="table-wrap"><table><thead><tr><th>${state.group==='none'?'Produto / SKU':groupLabels[state.group]+' / produto'}</th>${state.measureKeys.includes('quantity')?'<th class="num">Quantidade</th>':''}${state.measureKeys.includes('cost')?'<th class="num">Custo / unid.</th><th class="num"><button class="quiet" id="sort">Custo do saldo ↓</button></th>':''}${state.measureKeys.includes('sale')?'<th class="num">Preço / unid.</th><th class="num">Venda potencial</th>':''}</tr></thead><tbody>${body}</tbody></table></div>${rows.length?'':'<div class="empty">Nenhum produto · Ajustar filtros</div>'}<div class="bottom"><span>${rows.length} SKUs · ${state.group==='none'?'Sem agrupamento':all.length+' grupos'} · totais do resultado</span><div class="row"><button id="prev" ${state.page===0?'disabled':''}>Anterior</button><span>${state.page+1}</span><button id="next" ${(state.page+1)*state.pageSize>=all.length?'disabled':''}>Próxima</button></div><span>23 out 2026 · Colunas <button class="quiet" id="columns">⚙</button></span></div>`;}
function renderProduct(){const id=Number(new URL(location).searchParams.get('product')),r=data.find(r=>r.id===id);document.querySelector('#main').innerHTML=header('Produto')+`<button class="quiet back" id="back">← Voltar à consulta</button><h1>${r.name} · ${r.variant}</h1><p>${r.sku} · ${types[r.type]} · ${r.sports.map(s=>modalities[s]).join(' + ')}</p><section class="selected-data">${metrics([r])}<h2>Origem do custo</h2><p>Custo gerencial ilustrativo · quantidade-base e versões permanecem no percurso real.</p><p>Composição e leitor PDF existentes serão reutilizados na implementação.</p></section>`;document.querySelector('#back').onclick=()=>history.back();}
function openPicker(key){const dlg=document.querySelector('#picker'),source=key==='modalities'?modalities:key==='types'?types:key==='measures'?measures: key==='visible'?{modalities:'Modalidade',types:'Tipos de item',models:'Modelo'}:Object.fromEntries([...new Set(data.map(r=>r.model))].map(m=>[m,m]));let selected=clone(key==='measures'?state.measureKeys:key==='visible'?state.visibleFilters:state.filters[key]);dlg.innerHTML=`<h2>${{modalities:'Modalidades',types:'Tipos de item',measures:'Exibir medidas',visible:'Filtros visíveis',models:'Modelos'}[key]}</h2>${Object.entries(source).map(([id,label])=>`<label><input type="checkbox" value="${id}" ${selected.includes(id)?'checked':''}>${label}</label>`).join('')}<footer><button id="clear">${key==='measures'?'Comparar tudo':key==='visible'?'Padrão':'Todos'}</button><button class="primary" id="apply">Aplicar</button></footer>`;dlg.onchange=e=>{selected=e.target.checked?[...selected,e.target.value]:selected.filter(id=>id!==e.target.value)};dlg.querySelector('#clear').onclick=()=>{selected=key==='measures'?Object.keys(measures):key==='visible'?['modalities','types']:[];dlg.querySelectorAll('input').forEach(input=>input.checked=selected.includes(input.value))};dlg.querySelector('#apply').onclick=()=>{if(key==='measures'){if(!selected.length)return;state.measureKeys=selected;if(!selected.includes(state.chartMeasure))state.chartMeasure=selected[0]}else if(key==='visible')state.visibleFilters=selected;else state.filters[key]=selected;state.page=0;dlg.close();route();document.getElementById(key==='measures'?'measure':key)?.focus()};dlg.showModal();}
function save(){const dlg=document.querySelector('#picker');dlg.innerHTML='<h2>Salvar consulta</h2><label class="save-label">Nome<input id="view-name" value="Beach Tennis — executivo"></label><label><input type="checkbox" id="default-view" checked>Usar como padrão pessoal</label><footer><button id="cancel-save">Cancelar</button><button id="confirm-save" class="primary">Salvar</button></footer>';dlg.querySelector('#cancel-save').onclick=()=>dlg.close();dlg.querySelector('#confirm-save').onclick=()=>{const saved={...clone(state),page:0},isDefault=dlg.querySelector('#default-view').checked;localStorage.setItem('epic-planning2-view',JSON.stringify(saved));if(isDefault)localStorage.setItem(storageKey,JSON.stringify(saved));notice=isDefault?'Visão salva · padrão pessoal':'Visão salva';dlg.close();route()};dlg.showModal();}
